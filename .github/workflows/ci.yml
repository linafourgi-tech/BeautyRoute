name: CI

# Verification only -- no deployment, no Supabase production linking, no
# publishing step of any kind. Every credential below is a fixed dummy value
# committed in this file on purpose: the frontend job's tests all mock the
# Supabase client boundary (see docs/testing/TEST_STRATEGY.md), and the Edge
# Function job's tests set their own fake env vars in-process via
# Deno.env.set(). Nothing here ever reaches a real Supabase, Anthropic, or
# Mapbox endpoint.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality (lint, test, coverage, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Dummy, non-secret values -- only so import.meta.env.VITE_* resolves
      # to a defined string instead of undefined. No test relies on these
      # actually reaching a real Supabase project; every test that touches
      # src/lib/supabase.js mocks it directly.
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      VITE_MAPBOX_PUBLIC_TOKEN: ci-placeholder-mapbox-public-token
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit/component tests
        run: npm run test:run

      - name: Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle budget (Phase 13 Step 6 -- deterministic, local script, no external upload)
        run: npm run perf:bundle-budget

  edge-functions:
    name: Edge Function tests (Deno)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2 (v2.0.5)
        with:
          deno-version: "2.9.4"

      - name: Run Edge Function tests
        run: |
          deno test --allow-net --allow-env --allow-read --node-modules-dir=none \
            supabase/functions/_shared/planRules.test.ts \
            supabase/functions/ai-assistant/index.test.ts \
            supabase/functions/route-planner/index.test.ts

  security:
    name: Repository security gates (secrets, dependency audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history for the secret-history scan)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Secret scan (tracked files + git history, deterministic, no external upload)
        run: bash scripts/secret-scan.sh

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit gate (npm audit with a documented exception allowlist)
        run: node scripts/dependency-audit.mjs
