<!-- @dsCard group="Components" viewport="700x300" name="Media, Language & Experience" subtitle="EditorialImage, LanguageSwitcher, ExperienceSwitcher, FavoriteButton, RebookCard" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:20px;background:var(--bg-page)"></div>
<script type="text/babel">
const { EditorialImage, LanguageSwitcher, ExperienceSwitcher, FavoriteButton, RebookCard } = window.BeautyRouteDesignSystem_b9f150;
function Demo(){
  const [lang,setLang]=React.useState("en"),[exp,setExp]=React.useState("women"),[fav,setFav]=React.useState(true);
  return <div style={{display:'flex',flexDirection:'column',gap:18}}>
    <div style={{display:'flex',gap:16,alignItems:'center',flexWrap:'wrap'}}>
      <LanguageSwitcher lang={lang} onChange={setLang} />
      <ExperienceSwitcher value={exp} onChange={setExp} />
      <FavoriteButton saved={fav} onToggle={()=>setFav(!fav)} variant="pill" />
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
      <EditorialImage name="heroClient" ratio="3 / 4" />
      <EditorialImage name="categoryBeard" ratio="3 / 4" />
      <EditorialImage tone="gold" label="Promotion" ratio="3 / 4" />
      <EditorialImage name="categorySkin" ratio="3 / 4" />
    </div>
    <RebookCard professional="Lujain" service="Balayage touch-up" lastVisit="6 weeks ago" duration="45 min" price="SAR 250" suggestedDate="this week" />
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
