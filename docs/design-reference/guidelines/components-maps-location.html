<!-- @dsCard group="Components" viewport="700x360" name="Maps & Location" subtitle="MapCard, TravelCard, RouteTimeline, AddressCard, ServiceAreaSelector" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:20px;background:var(--bg-page)"></div>
<script type="text/babel">
const { MapCard, TravelCard, RouteTimeline, AddressCard, ServiceAreaSelector } = window.BeautyRouteDesignSystem_b9f150;
function Demo(){
  const [addr,setAddr]=React.useState(0),[r,setR]=React.useState(20);
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
    <MapCard label="Al Yasmin District" distanceKm={18} route />
    <div style={{display:'flex',flexDirection:'column',gap:12}}>
      <TravelCard destination="Al Yasmin District" distanceKm={18} minutes={22} leaveIn={12} />
      <AddressCard label="Home" address="Al Yasmin District, Riyadh" primary selected={addr===0} onSelect={()=>setAddr(0)} />
      <AddressCard label="Work" address="King Fahd Rd, Al Olaya" selected={addr===1} onSelect={()=>setAddr(1)} />
    </div>
    <div style={{padding:16,borderRadius:'var(--radius-lg)',border:'1px solid var(--border-subtle)',background:'var(--surface-card)'}}>
      <div style={{fontFamily:'var(--font-display)',fontSize:'var(--text-h4)',marginBottom:12,color:'var(--text-primary)'}}>Today's route</div>
      <RouteTimeline stops={[{time:"10:00",title:"Haircut",place:"Al Olaya"},{time:"12:00",title:"Balayage",place:"Al Malqa"},{time:"15:00",title:"Bridal styling",place:"Al Yasmin"}]} legs={[{minutes:11},{minutes:18}]} />
    </div>
    <div style={{padding:16,borderRadius:'var(--radius-lg)',border:'1px solid var(--border-subtle)',background:'var(--surface-card)'}}>
      <div style={{fontFamily:'var(--font-display)',fontSize:'var(--text-h4)',marginBottom:12,color:'var(--text-primary)'}}>Service area</div>
      <ServiceAreaSelector value={r} onChange={setR} fee="SAR 30" />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
