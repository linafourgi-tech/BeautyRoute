<link rel="stylesheet" href="../styles.css">
<div style="display:grid;grid-template-columns:1fr 1fr;height:200px;font-family:var(--font-body)">

<div style="font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-tertiary)">English · LTR</div>

</div>
<div dir="rtl" style="padding:22px 24px;display:flex;flex-direction:column;justify-content:center;gap:14px;background:var(--bg-page)">

<span style="align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:var(--accent-gold);color:var(--charcoal-900);padding:9px 20px;border-radius:var(--radius-pill);font-size:14px;font-weight:600">احجز الآن<span style="font-size:16px;line-height:1">←</span></span>

</div>
