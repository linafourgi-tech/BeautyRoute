<!-- @dsCard group="Colors" viewport="700x150" name="Dark Mode Surfaces" subtitle="OLED-friendly near-black with warm undertone" -->
<link rel="stylesheet" href="../styles.css">
<div data-theme="dark" style="display:flex;gap:10px;height:150px;padding:12px;background:var(--bg-page);box-sizing:border-box">
<div style="flex:1;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-primary);font-family:var(--font-body);font-size:12px">elevated</div>
<div style="flex:1;background:var(--surface-card-alt);border:1px solid var(--border-default);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-family:var(--font-body);font-size:12px">card-alt</div>
<div style="flex:1;background:var(--bg-sunken);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--accent-gold);font-family:var(--font-body);font-size:12px">accent</div>
</div>
