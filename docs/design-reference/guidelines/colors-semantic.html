<!-- @dsCard group="Colors" viewport="700x150" name="Semantic Colors" subtitle="Success, warning, error — muted, never saturated" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:12px;height:150px;padding:12px;font-family:var(--font-body);box-sizing:border-box;background:var(--bg-page)">
<div style="flex:1;background:var(--success-bg);color:var(--success-fg);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500">Success</div>
<div style="flex:1;background:var(--warning-bg);color:var(--warning-fg);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500">Warning</div>
<div style="flex:1;background:var(--error-bg);color:var(--error-fg);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500">Error</div>
</div>
