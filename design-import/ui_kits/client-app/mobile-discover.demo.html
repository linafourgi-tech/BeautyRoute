<!-- @dsCard group="Client App" viewport="390x780" name="Mobile — Discover" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="width:390px;height:780px;margin:0 auto;background:var(--bg-page);position:relative;overflow-y:auto"></div>
<script type="text/babel">
const { GalleryCard, Tag, Search } = window.BeautyRouteDesignSystem_b9f150;
const tabs=["Discover","Matches","Bookings","Profile"];
const icons = {
  Discover: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
  Matches: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>,
  Bookings: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>,
  Profile: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 6-6 8-6s6.5 2 8 6"/></svg>,
};
function NavItem({ label, active, onClick }) {
  return <button onClick={onClick} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4,background:'none',border:'none',cursor:'pointer',color:active?'var(--text-primary)':'var(--text-tertiary)'}}>
    {icons[label]}
    <span style={{fontSize:10,fontWeight:500}}>{label}</span>
  </button>;
}
function App(){
  const [tab,setTab]=React.useState("Discover");
  const items=["Sun-kissed waves","Soft curtain bangs","Glass hair","Bridal updo","Copper glow","Textured lob"];
  return <div>
    <div style={{padding:'20px 16px 12px',display:'flex',flexDirection:'column',gap:14}}>
      <div style={{fontFamily:'var(--font-display)',fontSize:20,color:'var(--text-primary)'}}>Beauty<span style={{color:'var(--accent-gold-strong)'}}>Route</span></div>
      <Search placeholder="Search styles" />
      <div style={{display:'flex',gap:8,overflowX:'auto'}}>{["All","Balayage","Curly","Bob"].map((t,i)=><Tag key={i} selected={i===0}>{t}</Tag>)}</div>
    </div>
    <div style={{padding:'0 16px 90px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
      {items.map((t,i)=><GalleryCard key={i} title={t} tag="Balayage" />)}
    </div>
    <div style={{position:'sticky',bottom:0,left:0,right:0,display:'flex',justifyContent:'space-around',padding:'14px 0',background:'rgba(250,247,242,0.92)',backdropFilter:'blur(var(--blur-glass))',borderTop:'1px solid var(--border-subtle)'}}>
      {tabs.map((t,i)=><NavItem key={i} label={t} active={t===tab} onClick={()=>setTab(t)} />)}
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
